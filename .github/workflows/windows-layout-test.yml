name: Windows x64 layout test
on:
  push:
    branches: [feature/usable-desktop-window-layout]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-layout-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-x64:
    if: github.repository == 'fermix42/scummvm-private'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/.github/windows-layout-triplets
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/.github/vcpkg-ports
      GIT_VCPKG_COMMIT: ef7dbf94b9198bc58f45951adcf1f041fcbc5ea0
    steps:
      - uses: actions/checkout@v4
      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        id: vcpkg
        with:
          vcpkgGitCommitId: ${{ env.GIT_VCPKG_COMMIT }}
      - name: Restore dependency cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: layout-release-vcpkg-${{ env.GIT_VCPKG_COMMIT }}-x64-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            layout-release-vcpkg-${{ env.GIT_VCPKG_COMMIT }}-x64-
            vcpkg-${{ env.GIT_VCPKG_COMMIT }}-x64-windows-
      - name: Cache checksum-verified GIFLIB source
        # SourceForge is returning 522 for this pinned version. Keep vcpkg's
        # exact upstream archive and checksum, using the Void Linux source mirror.
        env:
          PINNED_VCPKG_ROOT: ${{ steps.vcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}
        run: |
          $archive = Join-Path $env:PINNED_VCPKG_ROOT 'downloads/giflib-5.2.2.tar.gz'
          New-Item -ItemType Directory -Force (Split-Path $archive) | Out-Null
          Invoke-WebRequest https://sources.voidlinux.org/giflib-5.2.2/giflib-5.2.2.tar.gz -OutFile $archive
          $expected = '0865ab2b1904fa14640c655fdb14bb54244ad18a66e358565c00287875d00912343f9be8bfac7658cc0146200d626f7ec9160d7a339f20ba3be6b9941d73975f'
          if ((Get-FileHash $archive -Algorithm SHA512).Hash.ToLower() -ne $expected) { throw 'GIFLIB checksum mismatch' }
      - name: Cache checksum-verified LIBMIKMOD source
        env:
          PINNED_VCPKG_ROOT: ${{ steps.vcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}
        run: |
          $archive = Join-Path $env:PINNED_VCPKG_ROOT 'downloads/libmikmod-3.3.11.1.tar.gz'
          Invoke-WebRequest https://distfiles.gentoo.org/distfiles/a7/libmikmod-3.3.11.1.tar.gz -OutFile $archive
          $expected = 'f2439e2b691613847cd0787dd4e050116683ce7b05c215b8afecde5c6add819ea6c18e678e258c0a80786bef463f406072de15127f64368f694287a5e8e1a9de'
          if ((Get-FileHash $archive -Algorithm SHA512).Hash.ToLower() -ne $expected) { throw 'LIBMIKMOD checksum mismatch' }
      - name: Install dependencies
        run: |
          vcpkg integrate install
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          vcpkg install --triplet x64-windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve compiled dependencies even after a failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: layout-release-vcpkg-${{ env.GIT_VCPKG_COMMIT }}-x64-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
      - name: Generate Visual Studio solution
        run: |
          cmake -S devtools/create_project/cmake -B build-create-project
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-create-project --config Release -j 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory build-scummvm
          Set-Location build-scummvm
          ../build-create-project/Release/create_project.exe .. --msvc --vcpkg
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: microsoft/setup-msbuild@v2
      - name: Build Windows x64 Release
        run: |
          msbuild build-scummvm/scummvm.sln /m:2 /p:Configuration=Release /p:Platform=x64 /p:VcpkgEnableManifest=true /p:PreferredToolArchitecture=x64 /v:minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package and verify portable build
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          python devtools/create_project/scripts/package-window-layout.py --root . --build build-scummvm/Releasex64 --vcpkg vcpkg_installed/x64-windows --vs "$vs" --sha "$env:GITHUB_SHA" --output package
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload private Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-window-layout-windows-x64-${{ github.sha }}
          path: package/
          if-no-files-found: error
          retention-days: 14
