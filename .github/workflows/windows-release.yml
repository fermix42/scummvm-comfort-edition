name: Windows x64 release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-x64:
    if: github.repository == 'fermix42/scummvm-comfort-edition'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/.github/windows-layout-triplets
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/.github/vcpkg-ports
      GIT_VCPKG_COMMIT: ef7dbf94b9198bc58f45951adcf1f041fcbc5ea0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        id: vcpkg
        with:
          vcpkgGitCommitId: ${{ env.GIT_VCPKG_COMMIT }}
      - name: Restore dependency cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: comfort-release-vcpkg-${{ env.GIT_VCPKG_COMMIT }}-x64-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            comfort-release-vcpkg-${{ env.GIT_VCPKG_COMMIT }}-x64-
            layout-release-vcpkg-${{ env.GIT_VCPKG_COMMIT }}-x64-
            vcpkg-${{ env.GIT_VCPKG_COMMIT }}-x64-windows-
      - name: Cache checksum-verified GIFLIB source
        env:
          PINNED_VCPKG_ROOT: ${{ steps.vcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}
        run: |
          $archive = Join-Path $env:PINNED_VCPKG_ROOT 'downloads/giflib-5.2.2.tar.gz'
          New-Item -ItemType Directory -Force (Split-Path $archive) | Out-Null
          Invoke-WebRequest https://sources.voidlinux.org/giflib-5.2.2/giflib-5.2.2.tar.gz -OutFile $archive
          $expected = '0865ab2b1904fa14640c655fdb14bb54244ad18a66e358565c00287875d00912343f9be8bfac7658cc0146200d626f7ec9160d7a339f20ba3be6b9941d73975f'
          if ((Get-FileHash $archive -Algorithm SHA512).Hash.ToLower() -ne $expected) { throw 'GIFLIB checksum mismatch' }
      - name: Cache checksum-verified LIBMIKMOD source
        env:
          PINNED_VCPKG_ROOT: ${{ steps.vcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}
        run: |
          $archive = Join-Path $env:PINNED_VCPKG_ROOT 'downloads/libmikmod-3.3.11.1.tar.gz'
          $expected = 'f2439e2b691613847cd0787dd4e050116683ce7b05c215b8afecde5c6add819ea6c18e678e258c0a80786bef463f406072de15127f64368f694287a5e8e1a9de'
          $verified = $false
          $mirrors = @(
            'https://mirrors.xmission.com/gentoo/distfiles/a7/libmikmod-3.3.11.1.tar.gz',
            'https://wii.leseratte10.de/devkitPro/other-stuff/libraries/libmikmod-3.3.11.1.tar.gz',
            'https://distro.ibiblio.org/easyos/source/oe/dunfell/libmikmod-3.3.11.1.tar.gz'
          )
          foreach ($url in $mirrors) {
            try {
              Invoke-WebRequest $url -OutFile $archive -TimeoutSec 60
              if ((Get-FileHash $archive -Algorithm SHA512).Hash.ToLower() -eq $expected) { $verified = $true; break }
            } catch { Write-Warning $_ }
          }
          if (-not $verified) { throw 'No mirror supplied the pinned LIBMIKMOD archive' }
      - name: Install dependencies
        run: |
          vcpkg integrate install
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          vcpkg install --triplet x64-windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve compiled dependencies even after a failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: comfort-release-vcpkg-${{ env.GIT_VCPKG_COMMIT }}-x64-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
      - name: Generate Visual Studio solution
        run: |
          cmake -S devtools/create_project/cmake -B build-create-project
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-create-project --config Release -j 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory build-scummvm
          Set-Location build-scummvm
          ../build-create-project/Release/create_project.exe .. --msvc --vcpkg
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: microsoft/setup-msbuild@v2
      - name: Build Windows x64 Release
        run: |
          msbuild build-scummvm/scummvm.sln /m:2 /p:Configuration=Release /p:Platform=x64 /p:VcpkgEnableManifest=true /p:PreferredToolArchitecture=x64 /v:minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package and verify portable build
        id: package
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $sourceSha = git rev-parse HEAD
          python devtools/create_project/scripts/package-window-layout.py --root . --build build-scummvm/Releasex64 --vcpkg vcpkg_installed/x64-windows --vs "$vs" --sha "$sourceSha" --output package
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT
      - name: Create release archive
        id: archive
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $baseName = "scummvm-comfort-edition-$version-windows-x64"
          Rename-Item -LiteralPath package/scummvm-comfort-edition-windows-x64 -NewName $baseName
          $zip = "$baseName.zip"
          Compress-Archive -Path "package/$baseName" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content -Encoding ascii "$zip.sha256"
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "checksum=$zip.sha256" >> $env:GITHUB_OUTPUT
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $title = "ScummVM Comfort Edition $tag"
          $repo = '${{ github.repository }}'
          $sourceUrl = "https://github.com/$repo/tree/$tag"
          $notes = @(
            'Windows x64 portable build for users who do not want to build from source.'
            ''
            'Game data is not included.'
            ''
            'Corresponding source for this binary is available from the matching Git tag:'
            $sourceUrl
          ) -join "`n"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $title --notes "$notes"
          } else {
            gh release edit $tag --title $title --notes "$notes"
          }
          gh release upload $tag "${{ steps.archive.outputs.zip }}" "${{ steps.archive.outputs.checksum }}" --clobber
