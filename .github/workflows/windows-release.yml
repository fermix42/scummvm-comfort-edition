# Retired publisher. Permanently disable workflow ID 374228258 on GitHub:
# historical release tags still contain its old automatic publication code.
name: Retired Windows x64 release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Publisher retired. Use devtools/ce/publish-approved-release.ps1.'
          echo 'See doc/ce-release/PUBLICATION.md. Never re-enable this workflow.'
